<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>证书链检查站</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
          --ok:#22c55e; --bad:#f87171; --warn:#fbbf24; --line:#334155; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.5; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  header .meta { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 420px 1fr; gap:16px; padding:16px 24px; }
  @media (max-width:1000px){ main{ grid-template-columns:1fr; } }
  section.card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
                 padding:14px 16px; margin-bottom:16px; }
  section.card h2 { font-size:15px; margin:0 0 10px; color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  textarea, input, select { width:100%; background:#0b1220; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13px; }
  textarea { min-height:150px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; }
  button { background:var(--accent); color:#082231; border:0; border-radius:6px;
           padding:8px 14px; font-weight:600; cursor:pointer; margin:8px 8px 0 0; }
  button.secondary { background:#334155; color:var(--ink); }
  button.danger { background:var(--bad); color:#1f1010; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.ok { background:rgba(34,197,94,.15); color:var(--ok); }
  .pill.bad { background:rgba(248,113,113,.15); color:var(--bad); }
  .pill.warn { background:rgba(251,191,36,.15); color:var(--warn); }
  .chain { border:1px solid var(--line); border-radius:8px; margin:10px 0; overflow:hidden; }
  .chain.sel { border-color:var(--ok); }
  .chain-head { padding:8px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
                background:rgba(148,163,184,.06); cursor:pointer; }
  .cert { border-top:1px solid var(--line); padding:10px 12px; }
  .cert .sub { font-weight:600; }
  .cert .kv { color:var(--muted); font-size:12px; }
  .finding { margin:6px 0 0; padding:6px 10px; border-left:3px solid var(--bad);
             background:rgba(248,113,113,.08); font-size:12.5px; border-radius:0 6px 6px 0; }
  .finding.info { border-left-color:var(--warn); background:rgba(251,191,36,.08); }
  .anchor-item { display:flex; justify-content:space-between; align-items:center; gap:8px;
                 border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin:6px 0; font-size:12.5px; }
  .errbox { border-left:3px solid var(--bad); background:rgba(248,113,113,.08); padding:6px 10px;
            margin:6px 0; font-size:12.5px; border-radius:0 6px 6px 0; }
  pre.json { background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:10px;
             max-height:420px; overflow:auto; font-size:11.5px; }
  .muted { color:var(--muted); font-size:12px; }
  details summary { cursor:pointer; }
  .tag { font-family:ui-monospace,monospace; font-size:10.5px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>证书链检查站</h1>
  <span class="meta">离线 · 不使用系统信任库 · 不联网获取中间证书 · 会话版本 <b id="rev">-</b></span>
</header>
<main>
  <div>
    <section class="card">
      <h2>1 · 待检证书（PEM，可无序/多块）</h2>
      <textarea id="pem" placeholder="粘贴一个或多个 -----BEGIN CERTIFICATE----- 块…&#10;损坏块与私钥块会被跳过并在结果中列出。"></textarea>
      <label>目标叶证书指纹（留空 = 自动选择末端实体）</label>
      <input id="leaf" placeholder="sha256:...（可选）">
    </section>

    <section class="card">
      <h2>2 · 检查参数</h2>
      <label>验证时刻（UTC，ISO-8601）</label>
      <input id="at" type="datetime-local" step="1">
      <div class="row">
        <div><label>主机名 / IP</label><input id="host" value="example.com"></div>
        <div><label>用途 EKU</label>
          <select id="eku">
            <option value="1.3.6.1.5.5.7.3.1">serverAuth (TLS 服务端)</option>
            <option value="1.3.6.1.5.5.7.3.2">clientAuth (TLS 客户端)</option>
            <option value="">不检查用途</option>
          </select></div>
      </div>
      <button onclick="runCheck(false)">检查链</button>
      <button class="secondary" onclick="runCheck(true)">检查并导出证明 JSON</button>
    </section>

    <section class="card">
      <h2>3 · Trust Anchors（本会话显式信任）</h2>
      <textarea id="anchorPem" placeholder="粘贴根/锚点证书 PEM…" style="min-height:90px"></textarea>
      <div class="row">
        <div><label>优先级（小者优先）</label><input id="anchorPrio" type="number" value="100"></div>
        <div style="display:flex;align-items:flex-end"><button onclick="addAnchors()">加入会话</button></div>
      </div>
      <div id="anchors"></div>
    </section>

    <section class="card">
      <h2>4 · 算法/密钥策略（按日期生效，历史可重放）</h2>
      <div class="row">
        <div><label>类型</label><select id="pKind">
          <option value="retire-signature-algo">退役签名算法</option>
          <option value="min-key-size">最小密钥长度</option>
        </select></div>
        <div><label>目标（SHA1 / MD5 / RSA / EC）</label><input id="pTarget" value="SHA1"></div>
      </div>
      <div class="row">
        <div><label>生效时刻 UTC</label><input id="pAt" type="datetime-local" step="1"></div>
        <div><label>最小位数（仅长度策略）</label><input id="pSize" type="number" value="2048"></div>
      </div>
      <label>原因</label><input id="pReason" value="会话自定义策略">
      <button onclick="addPolicy()">添加策略</button>
      <div id="policies"></div>
    </section>
  </div>

  <div>
    <section class="card">
      <h2>结果</h2>
      <div id="summary" class="muted">尚未检查。</div>
      <div id="errors"></div>
      <div id="chains"></div>
      <div id="proofWrap" style="display:none">
        <h2 style="color:var(--accent);font-size:15px">证明 JSON（不含私钥）</h2>
        <div class="muted" style="margin-bottom:6px">
          <button class="secondary" onclick="copyProof()">复制 JSON</button>
          <a id="proofDownload" download="cert-chain-proof.json"></a>
        </div>
        <pre class="json" id="proof"></pre>
      </div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
